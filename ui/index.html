<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BPS 设置</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="reset-panel.css"><script src="_magpie/bridge.js"></script><script src="app.bundle.js" defer></script><script src="reset-panel.js" defer></script></head>
<body><main>
<header class="brand"><img src="icon.svg" width="36" height="36" alt=""><h1>BPS</h1></header>
<div class="page-tabs" role="tablist" aria-label="BPS 页面"><button type="button" role="tab" id="connection-tab" aria-selected="true" aria-controls="connection-section">连接设置</button><button type="button" role="tab" id="reset-tab" aria-selected="false" aria-controls="reset-section" tabindex="-1">额度重置</button></div>
<div id="connection-section" role="tabpanel" aria-labelledby="connection-tab">
<div id="settings"><fieldset id="controls" disabled>
<label for="mode">代理</label>
<select id="mode"><option value="inherit">跟随 Magpie</option><option value="proxy">指定代理</option><option value="direct">直连</option></select>
<div id="proxy-row" hidden><label for="proxy">HTTP(S) 代理地址</label><input id="proxy" type="password" autocomplete="off" spellcheck="false" placeholder="http://127.0.0.1:7891"></div>
<p id="network-note" class="note"></p>
<details><summary>WSS 中继（可选）</summary><div class="advanced">
<label class="toggle" for="relayEnabled"><input id="relayEnabled" type="checkbox">手动启用 WSS 中继</label>
<div id="relay-fields" hidden>
<label for="relayUrl">中继地址</label><input id="relayUrl" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="wss://你的域名/relay">
<label for="relayToken">访问密钥</label><input id="relayToken" type="password" autocomplete="off" spellcheck="false">
<p class="note">仅连接你信任的中继。启用后，请求和账号授权经加密通道交给中继转发；本机直连中继，不使用上方或 Magpie 的 HTTP 代理。关闭后恢复原网络路径。</p>
</div></div></details>
<details><summary>高级选项</summary><div class="advanced">
<label for="seconds">请求超时（秒）</label><input id="seconds" type="number" min="1" max="3600" step="1" required>
<label class="toggle" for="cache"><input id="cache" type="checkbox">缓存会话上下文</label>
</div></details>
<div class="actions"><button type="button" id="save">保存</button><button type="button" id="testRelay">测试 WSS</button><button type="button" id="reload">重新读取</button></div>
</fieldset></div>
<div id="probe-panel" hidden aria-live="polite"><img id="probe-image" hidden alt="WSS 实测结果"></div>
<p id="status" role="status" aria-live="polite">正在连接 Magpie…</p>
</div>
<div id="reset-section" role="tabpanel" aria-labelledby="reset-tab" hidden><div id="reset-panel"><div class="toolbar"><span>Codex 额度重置</span><button id="reset-refresh" type="button" disabled>刷新</button></div><div id="reset-rows"></div><p id="reset-status" role="status" aria-live="polite">切换到此页签后读取账号与重置次数。</p></div></div>
</main></body></html>
